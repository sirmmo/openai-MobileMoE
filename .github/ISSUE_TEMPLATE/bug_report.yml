name: Bug report
description: Something behaves differently from what the docs say
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `GET /health` (includes the version and checkpoint)
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Checkpoint
      placeholder: facebook/MobileMoE-S-QAT
  - type: textarea
    id: request
    attributes:
      label: Request
      description: The request body sent to the server
      render: json
    validations:
      required: true
  - type: textarea
    id: response
    attributes:
      label: Response
      description: The full response, including the `x_mobilemoe` block if present
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server logs
      render: shell
